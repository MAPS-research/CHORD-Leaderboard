name: apply-decision

# An `accept` or `reject` label on a candidate issue is the review decision: the registry change is
# committed straight to the default branch (the organization does not allow Actions to open PRs),
# then the issue gets a comment saying what changed and is closed.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-decision
  cancel-in-progress: false

jobs:
  apply:
    if: (github.event.label.name == 'accept' || github.event.label.name == 'reject') && contains(github.event.issue.labels.*.name, 'candidate')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTION: ${{ github.event.label.name }}
      NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Apply decision
        run: |
          if ! python -m discovery apply-decision --action "$ACTION" --event "$GITHUB_EVENT_PATH" \
                 --summary-out summary.md 2> error.txt; then
            { echo "Could not apply \`$ACTION\`:"; echo; cat error.txt; } > comment.md
            gh issue comment "$NUMBER" --body-file comment.md
            exit 1
          fi
      - name: Commit to the default branch and close the issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/
          git commit -m "registry: $ACTION candidate #$NUMBER"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BASE" && git push origin "HEAD:$BASE"; then pushed=1; break; fi
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            gh issue comment "$NUMBER" --body "Could not push the registry change for \`$ACTION\`; see the workflow log."
            exit 1
          fi
          { cat summary.md; echo; echo "Committed in $(git rev-parse --short HEAD)."; } > comment.md
          gh issue comment "$NUMBER" --body-file comment.md
          if [ "$ACTION" = "accept" ]; then reason=completed; else reason="not planned"; fi
          gh issue close "$NUMBER" --reason "$reason"
