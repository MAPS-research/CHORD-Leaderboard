name: discover

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Harvest papers published on or after YYYY-MM-DD (default: today minus lookback_days)"
        required: false
        default: ""
      dry_run:
        description: "Open no issues; upload candidates.jsonl instead"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SINCE: ${{ inputs.since }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code@2.1.295   # version whose flags judge.build_command was verified against
      - name: Ensure labels exist
        run: |
          gh label create candidate --color 1D76DB --description "Discovered leaderboard candidate" --force
          gh label create needs-manual-check --color FBCA04 --description "A criterion could not be verified automatically" --force
          gh label create accept --color 0E8A16 --description "Add to the registry (opens a PR)" --force
          gh label create reject --color B60205 --description "Record as rejected (opens a PR)" --force
          gh label create candidate-digest --color C5DEF5 --description "Weekly list of unconfirmed candidates" --force
          gh label create pipeline-failure --color 5319E7 --description "A discovery source failed in consecutive runs" --force
      - name: Fetch previous run summary
        run: |
          prev=$(gh run list --workflow discover.yml --status completed --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$prev" ]; then gh run download "$prev" --name last-run --dir prev || true; fi
      - name: Discover
        run: |
          args=(--summary-out last-run.json --prev-summary prev/last-run.json)
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run --out candidates.jsonl); fi
          python -m discovery run "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-run
          path: last-run.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && inputs.dry_run
        with:
          name: candidates
          path: candidates.jsonl
          if-no-files-found: ignore
