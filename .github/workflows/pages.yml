name: pages

# Build site/data/leaderboard.json from registry/ and results/, then publish site/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "results/**"
      - "site/**"
      - "leaderboard_site/**"
      - "discovery/models.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Build leaderboard data
        run: python -m leaderboard_site.build
      - name: Stamp asset links with the commit so browsers fetch the new files
        run: sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}\"/" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
